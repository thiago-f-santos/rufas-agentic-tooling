[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rufas-agentic-tooling"
version = "0.1.0"
description = "Agentic tooling, diagnostics, and domain specialist skills for RuFaS whole-farm dairy modeling."
authors = [
    {name = "RuFaS Agentic Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "deepdiff>=6.0.0",
    "jsonschema>=4.17.0"
]

[project.scripts]
rufas-inspect = "tools.rufas_inspector:main"
rufas-run = "tools.rufas_runner:main"
rufas-analyze = "tools.rufas_analyzer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "skills*"]
